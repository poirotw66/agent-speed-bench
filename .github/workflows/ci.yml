name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/agentspeedbench ./cmd/agentspeedbench
      - run: ./bin/agentspeedbench run -out /tmp/agent-speed-bench-runs -db /tmp/agent-speed-bench.db benchmarks/demo.yaml
