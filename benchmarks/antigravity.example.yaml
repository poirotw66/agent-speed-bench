name: agy-response
repeats: 3
jobs: 1
timeout_seconds: 180
agents:
  - name: antigravity
    adapter: agy
    model: gemini-3.8-flash-medium
    reasoning_effort: medium
cases:
  - name: first-response
    prompt: Print BENCH_DONE and do not modify files.
    verify:
      output_contains: BENCH_DONE
