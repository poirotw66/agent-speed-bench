name: native-comparison
repeats: 5
jobs: 1
timeout_seconds: 180
agents:
  - name: sol-medium
    adapter: codex
    model: gpt-6.1-sol
    reasoning_effort: medium
    service_tier: default
  - name: luna-high
    adapter: codex
    model: gpt-6-luna
    reasoning_effort: high
    service_tier: default
  - name: luna-high-fast
    adapter: codex
    model: gpt-6-luna
    reasoning_effort: high
    service_tier: fast
  - name: cursor-auto
    adapter: cursor
    model: auto
    trust_workspace: true
  - name: agy-low
    adapter: agy
    model: gemini-3.8-flash-low
    reasoning_effort: low
  - name: agy-medium
    adapter: agy
    model: gemini-3.8-flash-medium
    reasoning_effort: medium
  - name: agy-high
    adapter: agy
    model: gemini-3.8-flash-high
    reasoning_effort: high
cases:
  - name: enumerate
    prompt: |
      Do not call tools or modify files. Print the integers 1 through 100,
      one per line, then print BENCH_DONE on its own line. Do not add commentary.
    verify:
      integer_sequence:
        start: 1
        end: 100
        end_marker: BENCH_DONE
