name: real-go-lazygit
warmup_repeats: 0
repeats: 3
jobs: 1
timeout_seconds: 300
agents:
  - name: luna-high-isolated
    adapter: codex
    model: gpt-6-luna
    reasoning_effort: high
    service_tier: default
    isolate_config: true
cases:
  - name: lazygit-owner-casing
    prompt: >-
      GitHub pull request integration fails to associate a local branch with its
      pull request when repository owner casing differs between the PR API
      response and the configured remote URL. Repair owner matching while
      preserving exact branch-name matching and unrelated behavior. Change only
      pkg/commands/git_commands/github.go. Dependencies are vendored; use
      go test -mod=vendor ./pkg/commands/git_commands -run TestGenerateGithubPullRequestMap
      for public tests. Do not access the network.
    repo:
      path: ../runs/repos/lazygit
      commit: 8f258a3650cef809b911df24881712bc6b5d96bd
      fresh_history: true
    retain_files: [pkg/commands/git_commands/github.go]
    verify:
      timeout_seconds: 180
      core_tests:
        - command: ../scripts/verify-lazygit.py
          args: [core]
      regression_tests:
        - command: ../scripts/verify-lazygit.py
          args: [regression]
